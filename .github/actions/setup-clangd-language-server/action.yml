name: Set up the C/C++ language server
description: Install checksum-pinned clangd distributions.
runs:
  using: composite
  steps:
    - if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends libstdc++6 zlib1g
    - shell: bash
      run: |
        python3 tools/setup-clangd-language-server.py
        echo "$GITHUB_WORKSPACE/tools/clangd-language-server/installed/bin" >> "$GITHUB_PATH"
