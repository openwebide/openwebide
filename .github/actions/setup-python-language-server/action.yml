name: Set up the Python language server
description: Install the locked Pyright server and Python for real host checks.
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: '24'
    - uses: actions/setup-python@v5
      with:
        python-version: '3.13'
    - shell: bash
      run: |
        python3 tools/setup_language_tools.py python >> "$GITHUB_PATH"
