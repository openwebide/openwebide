name: Set up the Terraform language server
description: Install checksum-pinned Terraform and terraform-ls distributions.
runs:
  using: composite
  steps:
    - shell: bash
      run: |
        python3 -m unittest discover -s tools -p test_setup_terraform_language_server.py
        python3 tools/setup-terraform-language-server.py
        echo "$GITHUB_WORKSPACE/tools/terraform-language-server/installed/bin" >> "$GITHUB_PATH"
        echo "CHECKPOINT_DISABLE=1" >> "$GITHUB_ENV"
        echo "TF_IN_AUTOMATION=1" >> "$GITHUB_ENV"
