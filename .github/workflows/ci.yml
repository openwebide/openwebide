name: CI

on:
  pull_request:
  workflow_call:

env:
  CARGO_TERM_COLOR: always

jobs:
  backend-and-crates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
          components: clippy, rustfmt, llvm-tools
          targets: wasm32-wasip2, wasm32-unknown-unknown

      - name: Prepare browser parser C compiler
        timeout-minutes: 12
        run: bash tools/setup-wasm-compiler.sh

      - uses: Swatinem/rust-cache@v2

      - name: Format check
        run: cargo fmt --all --check

      - name: Validate release tooling and install configuration
        run: |
          python3 -m unittest discover -s tools -p 'test_release.py'
          python3 -m unittest discover -s tools -p 'test_host_updates.py'
          python3 -m unittest discover -s tools -p 'test_open_source.py'
          python3 -m unittest discover -s tools -p 'test_editor_measurements.py'
          python3 -m unittest discover -s tools -p 'test_editor_browser_runner.py'
          python3 tools/bundle_plugins.py --check
          python3 tools/release.py validate
          docker compose -f docker-compose.release.yml config --quiet
          OPENWEBIDE_SSH_AUTH_SOCK=/tmp/agent.sock OPENWEBIDE_SSH_CONFIG_DIR=/tmp/public-ssh docker compose -f docker-compose.release.yml -f docker-compose.ssh.yml config --quiet
          OPENWEBIDE_TAILSCALE_HOST=openwebide.example.ts.net OPENWEBIDE_SERVE_CONFIG_DIR=/tmp/serve docker compose -f docker-compose.https.yml config --quiet

      - name: Clippy (native crates)
        run: cargo clippy -p openwebide-core -p openwebide-llm -p openwebide-storage -p openwebide-agent -p openwebide-auth -p openwebide-plugin-sdk -p openwebide-plugin-runtime -p openwebide-plugin-build --features openwebide-core/editor-parser --all-targets -- -D warnings

      - name: Clippy (backend, wasm32-wasip2)
        run: cargo clippy -p openwebide-backend --target wasm32-wasip2 -- -D warnings

      - name: Clippy (frontend, wasm32-unknown-unknown)
        run: cargo clippy -p openwebide-frontend --target wasm32-unknown-unknown -- -D warnings

      - name: Clippy (editor measurements)
        run: |
          cargo clippy -p openwebide-editor-bench --features candidates --all-targets -- -D warnings
          cargo clippy -p openwebide-editor-bench --features candidates --target wasm32-unknown-unknown --all-targets -- -D warnings

      - name: Clippy (bridge)
        run: cargo clippy -p openwebide-bridge --all-targets -- -D warnings

      - name: Tests (native)
        run: cargo test -p openwebide-core -p openwebide-llm -p openwebide-storage -p openwebide-agent -p openwebide-auth -p openwebide-backend -p openwebide-plugin-sdk --features openwebide-core/editor-parser

      - name: Tests (editor storage workloads)
        run: cargo test -p openwebide-editor-bench --features candidates --release

      - name: Tests (frontend native)
        run: cargo test -p openwebide-frontend

      - name: Build backend component
        run: cargo build -p openwebide-backend --target wasm32-wasip2 --release

  plugin-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
          targets: wasm32-wasip2

      - uses: Swatinem/rust-cache@v2

      - name: Prepare isolated plugin builds
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Compile and verify offline executable defaults
        env:
          OPENWEBIDE_BUNDLED_ARTIFACTS: ${{ runner.temp }}/bundled-plugins.json
        run: |
          cargo run -p openwebide-plugin-runtime --bin openwebide-bundle-plugins --release --locked -- bridge/bundled/plugins.json "$OPENWEBIDE_BUNDLED_ARTIFACTS"
          cargo test -p openwebide-bridge --features bundled-defaults bundled_tests

      - name: Tests (bridge, plugin runtime, and isolated compiler)
        run: cargo test -p openwebide-bridge -p openwebide-plugin-runtime -p openwebide-plugin-build

  plugin-panels:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: openwebide/plugins
          ref: e517f4c0dff6182a26ca7283832021a148a9f82e
          path: .panel-reference
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
          targets: wasm32-wasip2
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Build and verify the first-party panel reference
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/target
          OPENWEBIDE_PR_REVIEW_COMPONENT: ${{ github.workspace }}/target/wasm32-wasip2/release/pr_review.wasm
          OPENWEBIDE_PR_REVIEW_MANIFEST: ${{ github.workspace }}/.panel-reference/plugins/pr-review/plugin.json
        run: |
          python3 - <<'PYREF'
          import json, subprocess
          from pathlib import Path
          reference = json.loads(Path("bridge/references/pr-review.json").read_text())
          checkout = Path(".panel-reference")
          actual = subprocess.check_output(["git", "-C", str(checkout), "rev-parse", "HEAD"], text=True).strip()
          assert actual == reference["commit"], "Panel reference checkout must match the immutable pin"
          manifest = json.loads((checkout / reference["path"] / "plugin.json").read_text())
          assert manifest["version"] == reference["version"]
          PYREF
          python3 .panel-reference/scripts/validate_rust.py --sdk crates/plugin-sdk --package .panel-reference/plugins/pr-review
          cargo test -p openwebide-plugin-runtime --test reference_panel -- --ignored
          cargo test -p openwebide-bridge --test plugin_panels -- --ignored

  bridge-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Check bridge Windows adapters with TLS
        run: cargo clippy -p openwebide-bridge -- -D warnings

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
          components: llvm-tools
          targets: wasm32-unknown-unknown, wasm32-wasip2

      - name: Prepare browser parser C compiler
        timeout-minutes: 12
        run: bash tools/setup-wasm-compiler.sh

      - uses: Swatinem/rust-cache@v2

      - name: Install Trunk
        run: |
          curl -sSL https://github.com/trunk-rs/trunk/releases/download/v0.21.14/trunk-x86_64-unknown-linux-gnu.tar.gz \
            | tar -xz -C /usr/local/bin trunk

      - name: Test PWA caching and installation
        run: node --test frontend/pwa/pwa.test.cjs

      - name: Build frontend
        run: cd frontend && trunk build --release

      - uses: ./.github/actions/setup-editor-browser
        id: chrome

      - name: Check production Rust/WASM editor worker
        env:
          CHROMEDRIVER: ${{ steps.chrome.outputs.chromedriver-path }}
          CHROME: ${{ steps.chrome.outputs.chrome-path }}
        run: |
          python3 tools/check-editor-worker.py
          python3 tools/check-about.py

      - name: Install Spin runtime for editor input verification
        run: |
          curl -fsSL https://github.com/spinframework/spin/releases/download/v4.1.0/spin-v4.1.0-linux-amd64.tar.gz \
            | tar -xz -C /usr/local/bin spin

      - name: Build backend for editor input verification
        run: cargo build -p openwebide-backend --target wasm32-wasip2 --release

      - name: Check production editor input, history and pointer selection
        env:
          CHROMEDRIVER: ${{ steps.chrome.outputs.chromedriver-path }}
          CHROME: ${{ steps.chrome.outputs.chrome-path }}
        run: |
          python3 tools/check-editor-input.py
          python3 tools/check-editor-input.py --windowed
          python3 tools/check-editor-pointer.py
          python3 tools/check-editor-pointer.py --language rs --repeat 1 --source crates/auth/src/lib.rs --line 62 --ending lf

  frontend-ui-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
          components: llvm-tools
          targets: wasm32-unknown-unknown

      - name: Prepare browser parser C compiler
        timeout-minutes: 12
        run: bash tools/setup-wasm-compiler.sh

      - uses: Swatinem/rust-cache@v2

      - uses: ./.github/actions/setup-editor-browser
        id: chrome

      # ChromeDriver otherwise launches the runner's preinstalled Chrome, whose
      # version needn't match the driver setup-chrome installed.
      - name: Point ChromeDriver at the installed Chrome
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: |
          printf '{"goog:chromeOptions":{"binary":"%s","args":["--window-size=1280,900"]}}\n' "$CHROME_PATH" \
            | tee webdriver.json > frontend/webdriver.json
          cp webdriver.json tools/editor-bench/webdriver.json

      - name: Install wasm-bindgen test runner
        run: |
          curl -fsSL https://github.com/rustwasm/wasm-bindgen/releases/download/0.2.128/wasm-bindgen-0.2.128-x86_64-unknown-linux-musl.tar.gz \
            | tar -xz --strip-components=1 -C /usr/local/bin wasm-bindgen-0.2.128-x86_64-unknown-linux-musl/wasm-bindgen wasm-bindgen-0.2.128-x86_64-unknown-linux-musl/wasm-bindgen-test-runner

      - name: Tests (frontend UI)
        env:
          CHROMEDRIVER: ${{ steps.chrome.outputs.chromedriver-path }}
          # Run the same contracts against optimized WASM to avoid loading the
          # ~250 MiB debug components module into Chrome. Partition editor and
          # other contracts so suite growth cannot exhaust one browser deadline.
          WASM_BINDGEN_TEST_TIMEOUT: "300"
        run: cargo test -p openwebide-frontend --release --target wasm32-unknown-unknown -- --skip 'editor::'

      - name: Measure shared editor storage in browser WASM
        env:
          CHROMEDRIVER: ${{ steps.chrome.outputs.chromedriver-path }}
        run: cargo test -p openwebide-editor-bench --features candidates --target wasm32-unknown-unknown --release -- --nocapture

  editor-ui-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: ['1/2', '2/2']
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
          components: llvm-tools
          targets: wasm32-unknown-unknown

      - name: Prepare browser parser C compiler
        timeout-minutes: 12
        run: bash tools/setup-wasm-compiler.sh

      - uses: Swatinem/rust-cache@v2

      - uses: ./.github/actions/setup-editor-browser
        id: chrome

      - name: Point ChromeDriver at the installed Chrome
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: |
          printf '{"goog:chromeOptions":{"binary":"%s","args":["--window-size=1280,900"]}}\n' "$CHROME_PATH" \
            | tee webdriver.json > frontend/webdriver.json

      - name: Install wasm-bindgen test runner
        run: |
          curl -fsSL https://github.com/rustwasm/wasm-bindgen/releases/download/0.2.128/wasm-bindgen-0.2.128-x86_64-unknown-linux-musl.tar.gz \
            | tar -xz --strip-components=1 -C /usr/local/bin wasm-bindgen-0.2.128-x86_64-unknown-linux-musl/wasm-bindgen wasm-bindgen-0.2.128-x86_64-unknown-linux-musl/wasm-bindgen-test-runner

      - name: Tests (editor UI)
        env:
          CHROMEDRIVER: ${{ steps.chrome.outputs.chromedriver-path }}
          # Inventory every current test artifact and check complete, disjoint
          # editor groups of at most 64 tests. Keep expensive matrices separate;
          # per-test readiness and every browser-run deadline are unchanged.
          WASM_BINDGEN_TEST_TIMEOUT: "300"
        run: python3 tools/run-editor-browser-tests.py --shard "${{ matrix.shard }}"

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Test container supervisor
        run: |
          bash docker/entrypoint-test.sh
          bash docker/ssh-init-test.sh

      - name: Build container image
        uses: docker/build-push-action@v6
        with:
          context: .
          build-args: |
            OPENWEBIDE_BUILD_COMMIT=${{ github.sha }}
          load: true
          tags: openwebide:ci
          cache-from: type=gha,scope=ci-docker
          cache-to: type=gha,mode=max,scope=ci-docker

      - name: Check bundled bridge
        run: docker run --rm openwebide:ci openwebide-bridge --help

      - name: Check SSH Git agent forwarding and strict host keys
        run: bash docker/ssh-test/check.sh openwebide:ci

      - name: Check host-owned workspace Git access
        run: docker run --rm -v "$PWD/docker/git-ownership-test.sh:/git-ownership-test.sh:ro" openwebide:ci bash /git-ownership-test.sh

      - name: Check HTTPS REST, SSE and WebSocket transport (Docker)
        run: python3 docker/https-test/check.py docker

      - name: Install rootless Podman
        run: sudo apt-get update && sudo apt-get install -y podman

      - name: Validate release Quadlet services without starting them
        run: |
          QUADLET_UNIT_DIRS="$PWD/deploy" /usr/lib/systemd/system-generators/podman-system-generator --user --dryrun > "$RUNNER_TEMP/quadlet-services"
          grep -F 'openwebide.service' "$RUNNER_TEMP/quadlet-services"
          grep -F 'openwebide-image.service' "$RUNNER_TEMP/quadlet-services"
          grep -F 'ghcr.io/openwebide/openwebide:stable' "$RUNNER_TEMP/quadlet-services"

      - name: Load the same image into rootless Podman
        run: docker save openwebide:ci | podman load

      - name: Check HTTPS REST, SSE and WebSocket transport (rootless Podman)
        run: python3 docker/https-test/check.py podman --port 8447
