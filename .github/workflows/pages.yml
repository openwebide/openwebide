name: Project site

on:
  push:
    branches: [main]
    paths: ['Cargo.toml', 'Cargo.lock', '**/Cargo.toml', 'rust-toolchain.toml', 'site/**', 'tools/open_source.py', 'third-party/**', 'frontend/fonts/**', 'docs/**', 'README.md', 'CHANGELOG.md', 'LICENSE', 'frontend/styles.css', 'frontend/playground/**', 'frontend/src/**', 'frontend/build.rs', 'crates/core/src/plugins/panels.rs', 'crates/plugin-sdk/**', 'tools/setup-wasm-compiler.sh', 'tools/check-panel-playground.py', 'tools/check-editor-recovery.py', '.github/actions/setup-editor-browser/**', 'frontend/pwa/favicon.svg', '.github/workflows/pages.yml']
  pull_request:
    paths: ['Cargo.toml', 'Cargo.lock', '**/Cargo.toml', 'rust-toolchain.toml', 'site/**', 'tools/open_source.py', 'third-party/**', 'frontend/fonts/**', 'docs/**', 'README.md', 'CHANGELOG.md', 'LICENSE', 'frontend/styles.css', 'frontend/playground/**', 'frontend/src/**', 'frontend/build.rs', 'crates/core/src/plugins/panels.rs', 'crates/plugin-sdk/**', 'tools/setup-wasm-compiler.sh', 'tools/check-panel-playground.py', 'tools/check-editor-recovery.py', '.github/actions/setup-editor-browser/**', 'frontend/pwa/favicon.svg', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      RUSTUP_TOOLCHAIN: 1.98.1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: site/requirements.txt
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
          targets: wasm32-unknown-unknown
          components: llvm-tools
      - name: Prepare the browser parser compiler
        run: bash tools/setup-wasm-compiler.sh
      - name: Install Trunk
        run: |
          curl -sSL https://github.com/trunk-rs/trunk/releases/download/v0.21.14/trunk-x86_64-unknown-linux-gnu.tar.gz | tar -xz -C /usr/local/bin trunk
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: pages-metadata
          cache-targets: true
      - run: pip install -r site/requirements.txt
      - name: Check documentation navigation
        run: python -m unittest discover -s site -p 'test_*.py'
      - name: Build and validate site
        run: python site/build.py --output "$RUNNER_TEMP/project-site"
      - uses: ./.github/actions/setup-editor-browser
        id: chrome
      - name: Check the compiled panel playground
        env:
          CHROMEDRIVER: ${{ steps.chrome.outputs.chromedriver-path }}
          CHROME: ${{ steps.chrome.outputs.chrome-path }}
        run: python tools/check-panel-playground.py --site "$RUNNER_TEMP/project-site"
      # The Pages convenience action excludes dot directories, including .well-known.
      - name: Package site including WebFinger discovery
        run: |
          tar --dereference --hard-dereference --exclude=.openwebide-site \
            -cf "$RUNNER_TEMP/artifact.tar" -C "$RUNNER_TEMP/project-site" .
          tar -tf "$RUNNER_TEMP/artifact.tar" | grep -Fx "./.well-known/webfinger"
      - uses: actions/upload-artifact@v4
        with:
          name: github-pages
          path: ${{ runner.temp }}/artifact.tar
          retention-days: 1
          if-no-files-found: error

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - uses: actions/deploy-pages@v4
        id: deployment
