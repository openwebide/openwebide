[package]
name = "openwebide-core"
description = "Shared domain types for Open WebIDE"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
openwebide-plugin-sdk = { version = "=0.1.0", default-features = false }
openwebide-language-grammars = { path = "../language-grammars", version = "0.1.0", default-features = false, optional = true }
futures = { workspace = true }
chrono = { version = "0.4", default-features = false, features = ["std"] }
chrono-tz = "0.10"
croner = "4.0"
base64 = { workspace = true }
ec4rs = { version = "1.2", path = "../../vendor/ec4rs", features = ["allow-empty-values"] }
html5ever = "0.40"
ignore = "0.4.33"
regex = "1.13.1"
regex-automata = { version = "0.4.18", default-features = false, features = ["std"] }
unicode-segmentation = "1.13.3"
unicode-bidi = "0.3.18"
unicode-width = "0.2.2"
serde = { workspace = true }
serde_json = { workspace = true }
semver = "1"
sha1 = { workspace = true }
sha2 = { workspace = true }
url = "2"
serde_yaml_ng = "0.10"
zip = { version = "6", default-features = false, features = ["deflate-flate2"] }
tar = { version = "0.4", default-features = false }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }

tree-sitter = { version = "=0.27.0", optional = true }


hpke = { version = "0.13.0", default-features = false, features = ["alloc", "x25519"], optional = true }
rand_chacha = { version = "0.9", optional = true }

[features]
private-input = ["dep:hpke", "dep:rand_chacha"]
test-support = []
editor-analysis = []
syntax-engine = ["editor-analysis", "dep:tree-sitter", "dep:openwebide-language-grammars"]
editor-parser = ["syntax-engine", "openwebide-language-grammars/all"]
syntax-rust = ["syntax-engine", "openwebide-language-grammars/rust"]
syntax-javascript-typescript = ["syntax-engine", "openwebide-language-grammars/javascript-typescript"]
syntax-python = ["syntax-engine", "openwebide-language-grammars/python"]
syntax-java = ["syntax-engine", "openwebide-language-grammars/java"]
syntax-csharp = ["syntax-engine", "openwebide-language-grammars/csharp"]
syntax-c-cpp = ["syntax-engine", "openwebide-language-grammars/c-cpp"]
syntax-php = ["syntax-engine", "openwebide-language-grammars/php"]
syntax-shell = ["syntax-engine", "openwebide-language-grammars/shell"]
syntax-go = ["syntax-engine", "openwebide-language-grammars/go"]
syntax-html = ["syntax-engine", "openwebide-language-grammars/html"]
syntax-css = ["syntax-engine", "openwebide-language-grammars/css"]
syntax-json = ["syntax-engine", "openwebide-language-grammars/json"]
syntax-yaml = ["syntax-engine", "openwebide-language-grammars/yaml"]
syntax-toml = ["syntax-engine", "openwebide-language-grammars/toml"]
syntax-markdown = ["syntax-engine", "openwebide-language-grammars/markdown"]
syntax-ini = ["syntax-engine", "openwebide-language-grammars/ini"]
syntax-xml = ["syntax-engine", "openwebide-language-grammars/xml"]
syntax-sql = ["syntax-engine", "openwebide-language-grammars/sql"]
syntax-plain = ["syntax-engine", "openwebide-language-grammars/plain"]

[dev-dependencies]
futures = { workspace = true }
proptest = "1.11"


[lints]
workspace = true
