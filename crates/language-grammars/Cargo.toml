[package]
name = "openwebide-language-grammars"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
license = "MIT"
description = "Grammar descriptors and language policies for host-executed language plugins"

[dependencies]
openwebide-plugin-sdk = { version = "=0.1.0", default-features = false }
tree-sitter = "=0.27.0"
html5ever = "0.40"
tree-sitter-rust = { version = "=0.24.2", path = "../../vendor/tree-sitter-rust" }
tree-sitter-typescript = { version = "=0.23.2" }
tree-sitter-javascript = { version = "=0.25.0" }
tree-sitter-python = { version = "=0.25.0" }
tree-sitter-java = { version = "=0.23.5" }
tree-sitter-c-sharp = { version = "=0.23.5" }
tree-sitter-cpp = { version = "=0.23.4" }
tree-sitter-php = { version = "=0.24.2" }
tree-sitter-bash = { version = "=0.25.1" }
tree-sitter-c = { version = "=0.24.2" }
tree-sitter-go = { version = "=0.25.0" }
tree-sitter-html = { version = "=0.23.2" }
tree-sitter-css = { version = "=0.25.0" }
tree-sitter-json = { version = "=0.24.8" }
tree-sitter-yaml = { version = "=0.7.2" }
tree-sitter-toml-ng = { version = "=0.7.0" }
tree-sitter-md = { version = "=0.5.3" }
tree-sitter-ini = { version = "=1.4.0" }
tree-sitter-xml = { version = "=0.7.0" }

[lints]
workspace = true
